name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  GODOT_RELEASE: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Import and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -eux
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${TAG}_linux.x86_64
          ln -sf ~/godot/Godot_v${TAG}_linux.x86_64 ~/godot/godot

      - name: Import project
        run: |
          # First import can report a non-zero code while still succeeding, so
          # run it twice and judge by the second pass.
          ~/godot/godot --headless --import --path . || true
          ~/godot/godot --headless --import --path .

      # Catches a script that fails to parse. Those do not fail a headless run,
      # they hang it, which looks like a slow test until the job times out.
      - name: Parse-check every script
        run: GODOT=~/godot/godot ./tools/lint.sh

      - name: Run smoke test
        run: ~/godot/godot --headless --path . res://tests/smoke_test.tscn

      - name: Run world test
        run: ~/godot/godot --headless --path . res://tests/world_test.tscn

      # Guards the input map. Every key was once bound to device 16, which
      # matches no real key press, so nothing on the keyboard did anything.
      - name: Check the game can be started
        run: ~/godot/godot --headless --path . res://tests/playtest/start_game.tscn

      - name: Play the first run
        run: ~/godot/godot --headless --path . res://tests/playtest/first_run.tscn

      # Compares pixels rather than file bytes. Two Pillow versions encode the
      # same image to different bytes, and a byte comparison then fails on a
      # machine whose Pillow differs from the one that committed the art,
      # which says nothing about whether the art is right.
      - name: Verify generated content is up to date
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/verify_generated.py \
            || (echo "::error::assets/ or levels/ differ from what the tools produce." && exit 1)

  build:
    name: Build ${{ matrix.preset }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Web
            out: build/web/index.html
            artifact: abyssbound-web
            dir: build/web
          - preset: Windows Desktop
            out: build/windows/Abyssbound.exe
            artifact: abyssbound-windows
            dir: build/windows
          - preset: macOS
            out: build/macos/Abyssbound.zip
            artifact: abyssbound-macos
            dir: build/macos
          - preset: Linux
            out: build/linux/Abyssbound.x86_64
            artifact: abyssbound-linux
            dir: build/linux
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -eux
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates"
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${TAG}_linux.x86_64
          ln -sf ~/godot/Godot_v${TAG}_linux.x86_64 ~/godot/godot
          curl -fL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Import project
        run: |
          ~/godot/godot --headless --import --path . || true
          ~/godot/godot --headless --import --path .

      # The macOS preset carries a version number of its own, which is what the
      # Mac shows in Get Info. Take it from the tag so it cannot drift.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          # macOS only accepts digits and periods here, so take the numeric
          # core of the tag. v1.2.0-beta stamps as 1.2.0 rather than failing.
          VERSION="$(printf '%s' "${GITHUB_REF_NAME#v}" | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ -z "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} has no MAJOR.MINOR.PATCH in it, which the macOS build needs."
            exit 1
          fi
          sed -i "s|^application/short_version=.*|application/short_version=\"${VERSION}\"|" export_presets.cfg
          sed -i "s|^application/version=.*|application/version=\"${VERSION}\"|" export_presets.cfg
          grep -n '^application/short_version=\|^application/version=' export_presets.cfg

      - name: Export
        run: |
          mkdir -p "${{ matrix.dir }}"
          ~/godot/godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}"

      - name: Check the export is not empty
        run: |
          test -s "${{ matrix.out }}"
          ls -la "${{ matrix.dir }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}
          if-no-files-found: error

  # Loads the exported build in a real Chromium. Not a performance gate: a CI
  # browser has no GPU and falls back to software rendering, so its frame rate
  # measures the emulator. What this proves is that the wasm loads, the game
  # reaches the point of running, and nothing throws on the way.
  browser:
    name: Check the browser build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: abyssbound-web
          path: build/web

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run the browser check
        run: node tests/playtest/browser_check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abyssbound-browser-screenshot
          path: |
            build/browser_check.png
            build/browser_title.png
          if-no-files-found: warn

  vercel:
    name: Deploy playable build to Vercel
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: abyssbound-web
          path: build/web

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets are not set, so there is nothing to deploy to."
            echo "Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID under"
            echo "Settings > Secrets and variables > Actions. See README.md."
            exit 0
          fi
          cp vercel.json build/web/vercel.json
          npm install --global vercel@latest
          vercel deploy build/web --prod --yes --archive=tgz --token "$VERCEL_TOKEN"

  # GitHub Pages is a backup host. Turn it on by setting the repository
  # variable ENABLE_PAGES to "true" and enabling Pages in Settings > Pages
  # with "GitHub Actions" as the source.
  pages:
    name: Publish playable build to Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: abyssbound-web
          path: web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  # Tagging a version publishes the desktop builds as a GitHub Release, which is
  # the only artifact anyone can download without a GitHub account. Actions
  # artifacts expire and need a login, so they are no good for sending to
  # playtesters. Cut one with: git tag v0.1.0 && git push origin v0.1.0
  release:
    name: Publish downloadable builds
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: abyssbound-windows
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: abyssbound-macos
          path: dist/macos

      - name: Name the files after the tag
        run: |
          set -eux
          mkdir -p release
          cp dist/windows/Abyssbound.exe "release/Abyssbound-${GITHUB_REF_NAME}-Windows.exe"
          cp dist/macos/Abyssbound.zip "release/Abyssbound-${GITHUB_REF_NAME}-macOS.zip"
          ls -la release

      - name: Write the notes
        run: |
          cat > notes.md <<'EOF'
          Download the file for your machine. The game data is inside the
          download, so there is nothing else to install.

          | Machine | File |
          | --- | --- |
          | Windows | `Abyssbound-VERSION-Windows.exe` |
          | Mac (Intel and Apple Silicon) | `Abyssbound-VERSION-macOS.zip` |

          **Windows.** Double-click the `.exe`. Windows will say it does not
          recognise the app, because the build is not signed with a paid
          certificate. Click **More info**, then **Run anyway**.

          **Mac.** Unzip, then **right-click** `Abyssbound.app` and choose
          **Open**, then **Open** again. Do not double-click it the first time:
          the build is not notarised, so double-clicking gives you a dead end
          that says it cannot be opened. Right-click and Open gives you the
          button that lets it through. You only have to do this once.

          Prefer no download at all? The browser build plays on the web with
          nothing to install.
          EOF
          sed -i "s/VERSION/${GITHUB_REF_NAME}/g" notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Abyssbound $GITHUB_REF_NAME" \
            --notes-file notes.md
